[package]
name = "recollect"
version = "0.4.0"
edition = "2024"
rust-version = "1.90"
description = "Local, private semantic search over your photos and videos"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["search", "clip", "photos", "video", "semantic"]
categories = ["multimedia", "gui"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
directories = "6"
eframe = "0.37"
egui = "0.37"
fast_image_resize = "6"
ffmpeg-next = "9"
hex = "0.4.3"
image = { version = "0.25", default-features = false, features = ["rayon", "jpeg", "png", "webp", "gif", "bmp", "tiff"] }
jpeg-decoder = "0.3"
kamadak-exif = "0.6"
ndarray = "0.17"
open = "5"
ort = { version = "=2.0.0-rc.15", features = ["webgpu"] }
parking_lot = "0.13.0"
pollster = "1.0.1"
rayon = "1.12.0"
rfd = "0.17.2"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3"

[dev-dependencies]
egui_kittest = "0.37"
tempfile = "3.27.0"

[profile.dev.package."*"]
# Dependencies (image decoding, resizing, ONNX glue) are unbearably slow unoptimized.
opt-level = 2

[profile.release]
lto = "thin"
