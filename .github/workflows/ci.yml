name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RECOLLECT_NO_GPU: "1"

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install FFmpeg and GUI dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libavcodec-dev libavformat-dev libavutil-dev \
            libavfilter-dev libavdevice-dev libswscale-dev libswresample-dev ffmpeg \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libvulkan-dev mesa-vulkan-drivers
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config
      - name: Install FFmpeg (Windows, LGPL shared build)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The FFmpeg-Builds project replaces its builds as FFmpeg releases come out, so look up
          # the current 8.x shared LGPL build instead of naming one that will disappear.
          $repo = "FFmpeg-Builds/FFmpeg-Builds"
          $asset = gh release view latest -R $repo --json assets --jq '.assets[].name' |
            Where-Object { $_ -match '^ffmpeg-n8\.\d+-latest-win64-lgpl-shared-8\.\d+\.zip$' } |
            Select-Object -First 1
          if (-not $asset) { throw "no FFmpeg 8.x win64 LGPL shared build in $repo" }
          Write-Host "Using $asset"
          gh release download latest -R $repo -p $asset -O ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath $env:RUNNER_TEMP
          $dir = Get-ChildItem "$env:RUNNER_TEMP" -Directory -Filter "ffmpeg-*" | Select-Object -First 1
          "FFMPEG_DIR=$($dir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$($dir.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: cargo nextest run
        shell: bash
        run: |
          set -o pipefail
          if ! cargo nextest run --no-fail-fast 2>&1 | tee nextest.log; then
            # Name the failing tests and their panic messages as annotations, so the run page
            # (and the API, without signing in) says what failed.
            grep -E '^[[:space:]]+(FAIL|SIGSEGV|SIGABRT|TIMEOUT)' nextest.log | sed -E 's/^[[:space:]]+//' |
              sort -u | head -10 | sed -e 's/%/%25/g' -e 's/^/::error::/'
            grep -E -A 1 'panicked at' nextest.log | grep -v -- '^--$' | paste -d ' ' - - |
              sed -E 's/[[:space:]]+/ /g; s/^ //' | sort -u | head -10 |
              sed -e 's/%/%25/g' -e 's/^/::error::/'
            exit 1
          fi
      - run: cargo test --doc

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
